# Builds, signs, notarizes and publishes the macOS build of an app when its
# repo pushes a release tag. Apps call it from .github/workflows/release.yml,
# next to release-windows.yml when they ship for Windows too:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     mac:
#       uses: Moulik-Budhiraja/app-hosting/.github/workflows/release-mac.yml@main
#       secrets: inherit
#
# Everything app-specific comes from the repo's apps.json (builds.mac, see DESIGN.md).
# Secrets live in the repo's "production" environment; `apps init` sets them.
# If the build command needs secrets of its own, list them with
#   with: { build-secrets: GOOGLE_OAUTH_CLIENT_BASE64 }
#
# Only for repos owned by Moulik-Budhiraja: GitHub's secrets: inherit doesn't
# pass secrets (environment secrets included) to another owner's reusable
# workflow. Other repos, such as Proletic's, run actions/release-mac in their own
# job instead (see that action and DESIGN.md). This workflow wraps that action.
name: Release Mac app

on:
  workflow_call:
    inputs:
      directory:
        description: Folder holding apps.json, relative to the repo root.
        type: string
        default: .
      tooling-ref:
        description: >-
          Ref of Moulik-Budhiraja/app-hosting to take the scripts and CLI from. Keep it
          the same as the ref after @ in `uses:`; GitHub doesn't tell a called
          workflow which ref it was called at.
        type: string
        default: main
      build-secrets:
        description: >-
          Names of extra secrets the build command needs, separated by spaces,
          commas or newlines, such as GOOGLE_OAUTH_CLIENT_BASE64. Each one comes
          from the caller (secrets: inherit, including the production
          environment) and reaches the build step as an environment variable of
          the same name. The run fails if one isn't set.
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_KEY_ID:
        required: false
      APPLE_ISSUER_ID:
        required: false
      APPS_TOKEN:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build, notarize and publish
    runs-on: [self-hosted, macos-ephemeral]
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    concurrency:
      group: release-mac-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # The steps live in actions/release-mac, which apps owned by other
      # accounts call from their own job. Check out the app first: checking it
      # out later would clean .apps-tooling away.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          repository: Moulik-Budhiraja/app-hosting
          ref: ${{ inputs.tooling-ref }}
          path: .apps-tooling
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: inputs.build-secrets != ''
        with:
          node-version: 24

      # build-secrets names secrets that came with secrets: inherit. Turn them
      # into build-env lines here, so the action gets only those secrets.
      - name: Pick the build secrets
        id: build-env
        if: inputs.build-secrets != ''
        shell: bash
        env:
          APPS_BUILD_SECRETS: ${{ inputs.build-secrets }}
          APPS_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          node .apps-tooling/scripts/common/build-env.mjs from-secrets >> "$GITHUB_OUTPUT"

      - name: Build, notarize and publish
        uses: ./.apps-tooling/actions/release-mac
        with:
          checkout: 'false'
          directory: ${{ inputs.directory }}
          apps-token: ${{ secrets.APPS_TOKEN }}
          sparkle-private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          apple-certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-key-id: ${{ secrets.APPLE_KEY_ID }}
          apple-issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          build-env: ${{ steps.build-env.outputs.build_env }}
