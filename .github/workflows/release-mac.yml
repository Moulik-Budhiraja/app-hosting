# Builds, signs, notarizes and publishes a Mac app when its repo pushes a
# release tag. Apps call it from .github/workflows/release.yml:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     release:
#       uses: Moulik-Budhiraja/app-hosting/.github/workflows/release-mac.yml@main
#       secrets: inherit
#
# Everything app-specific comes from the repo's apps.json (see DESIGN.md).
# Secrets live in the repo's "production" environment; `apps init` sets them.
name: Release Mac app

on:
  workflow_call:
    inputs:
      directory:
        description: Folder holding apps.json, relative to the repo root.
        type: string
        default: .
      tooling-ref:
        description: >-
          Ref of Moulik-Budhiraja/app-hosting to take the scripts and CLI from. Keep it
          the same as the ref after @ in `uses:`; GitHub doesn't tell a called
          workflow which ref it was called at.
        type: string
        default: main
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_KEY_ID:
        required: false
      APPLE_ISSUER_ID:
        required: false
      APPS_TOKEN:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build, notarize and publish
    runs-on: [self-hosted, macos-ephemeral]
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    concurrency:
      group: release-mac-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.directory }}
    env:
      TOOLING: ${{ github.workspace }}/.apps-tooling
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          repository: Moulik-Budhiraja/app-hosting
          ref: ${{ inputs.tooling-ref }}
          path: .apps-tooling
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read apps.json
        id: config
        run: |
          "$TOOLING/scripts/mac/read-config.sh" apps.json | tee -a "$GITHUB_OUTPUT"

      - name: Check the tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ steps.config.outputs.tag_prefix }}
        run: |
          [[ $REF_TYPE == tag ]] || { echo "Releases run from tags like ${PREFIX}1.2.3 pushed on main" >&2; exit 1; }
          "$TOOLING/scripts/mac/check-tag.sh" "$TAG" "$PREFIX" | tee -a "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: existing
        env:
          REMOTE_URL: ${{ steps.config.outputs.remote_url }}
          APP: ${{ steps.config.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A local release (release-local.sh) or an earlier attempt may have
          # published this version already; the server would refuse it again.
          # shellcheck disable=SC2016 # the JavaScript below is meant literally
          published=$(node -e '
            const [url, version] = process.argv.slice(1);
            fetch(url).then(async (r) => {
              if (r.status === 404) { console.error(`${url} not found: create the app with \`apps create\` first`); process.exit(1); }
              if (!r.ok) { console.error(`${url} answered ${r.status}`); process.exit(1); }
              const body = await r.json();
              const list = Array.isArray(body) ? body : body.releases ?? [];
              console.log(list.some((x) => x.version === version) ? "true" : "false");
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ' "$REMOTE_URL/$APP/releases.json" "$VERSION")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [[ $published == true ]]; then
            echo "::notice::$APP $VERSION is already published on $REMOTE_URL; nothing to do."
          fi

      - name: Build the apps CLI
        if: steps.existing.outputs.published != 'true'
        working-directory: ${{ github.workspace }}/.apps-tooling/cli
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up the signing keychain
        if: steps.existing.outputs.published != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          "$TOOLING/scripts/mac/keychain.sh" create > /dev/null

      - name: Build, sign and notarize
        id: build
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          "$TOOLING/scripts/mac/build-release.sh" apps.json | tee -a "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        if: steps.existing.outputs.published != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # An annotated tag's message becomes the release notes. actions/checkout
          # fetches the pushed tag as a lightweight tag, so fetch the tag object.
          git fetch --quiet --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          file="$RUNNER_TEMP/release-notes.md"
          if [[ $(git cat-file -t "refs/tags/$TAG") == tag ]]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' > "$file"
          fi
          if [[ -s $file ]] && grep -q '[^[:space:]]' "$file"; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.existing.outputs.published != 'true'
        env:
          APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
          DMG: ${{ steps.build.outputs.dmg }}
          ZIP: ${{ steps.build.outputs.zip }}
          BLOCKMAP: ${{ steps.build.outputs.blockmap }}
          MINIMUM_SYSTEM_VERSION: ${{ steps.build.outputs.minimum_system_version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          [[ -n $APPS_TOKEN ]] || { echo "APPS_TOKEN isn't set on the production environment; run \`apps init\`" >&2; exit 1; }
          args=(publish --version "$VERSION" --build "$BUILD" --dmg "$DMG")
          [[ -n $ZIP ]] && args+=(--zip "$ZIP")
          [[ -n $BLOCKMAP ]] && args+=(--blockmap "$BLOCKMAP")
          [[ -n $MINIMUM_SYSTEM_VERSION ]] && args+=(--minimum-system-version "$MINIMUM_SYSTEM_VERSION")
          [[ -n $NOTES_FILE ]] && args+=(--notes-file "$NOTES_FILE")
          node "$TOOLING/cli/dist/index.js" "${args[@]}"

      - name: Check the live feed
        if: steps.existing.outputs.published != 'true'
        env:
          REMOTE_URL: ${{ steps.config.outputs.remote_url }}
          APP: ${{ steps.config.outputs.app }}
          UPDATER: ${{ steps.config.outputs.updater }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [[ $UPDATER == sparkle ]]; then
            feed="$REMOTE_URL/$APP/appcast.xml"
            pattern="<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"
          else
            feed="$REMOTE_URL/$APP/latest-mac.yml"
            pattern="version: $VERSION"
          fi
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 "$feed" | grep -qF "$pattern"; then
              echo "$feed offers $VERSION"
              exit 0
            fi
            sleep 3
          done
          echo "$feed doesn't offer $VERSION" >&2
          exit 1

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n ${APPS_SECRET_DIR:-} ]]; then
            "$TOOLING/scripts/mac/keychain.sh" delete
          fi
