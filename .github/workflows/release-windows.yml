# Builds, signs and publishes the Windows build of an app when its repo pushes
# a release tag. Apps call it from .github/workflows/release.yml, next to
# release-mac.yml when they ship for macOS too:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     windows:
#       uses: Moulik-Budhiraja/app-hosting/.github/workflows/release-windows.yml@main
#       secrets: inherit
#
# Everything app-specific comes from the repo's apps.json (builds.windows, see
# DESIGN.md). Secrets live in the repo's "production" environment; `apps init`
# sets them. Installers are signed with Azure Artifact Signing.
# If the build command needs secrets of its own, list them with
#   with: { build-secrets: GOOGLE_OAUTH_CLIENT_BASE64 }
#
# By default it runs on [self-hosted, windows]: a fresh Windows 11 x64 Hyper-V
# VM per job, deleted afterwards, with Git, PowerShell 7, the Windows SDK and
# the Artifact Signing client tools installed. It serves private repos under
# Moulik-Budhiraja and Proletic, and public ones only from its allowlist. Pass
# runs-on: '"windows-latest"' to use GitHub's hosted runner instead. Any runner
# needs Git for Windows, with its bash first on PATH (not WSL's), and
# PowerShell 7. The workflow sets up Node 24 and the .NET 8 runtime that
# signing needs.
#
# Only for repos owned by Moulik-Budhiraja: GitHub's secrets: inherit doesn't
# pass secrets (environment secrets included) to another owner's reusable
# workflow. Other repos, such as Proletic's, run actions/release-windows in their own
# job instead (see that action and DESIGN.md). This workflow wraps that action.
name: Release Windows app

on:
  workflow_call:
    inputs:
      directory:
        description: Folder holding apps.json, relative to the repo root.
        type: string
        default: .
      tooling-ref:
        description: >-
          Ref of Moulik-Budhiraja/app-hosting to take the scripts and CLI from. Keep it
          the same as the ref after @ in `uses:`; GitHub doesn't tell a called
          workflow which ref it was called at.
        type: string
        default: main
      runs-on:
        description: >-
          JSON array of runner labels, or a JSON string such as '"windows-latest"'
          for GitHub's hosted runner.
        type: string
        default: '["self-hosted", "windows"]'
      build-secrets:
        description: >-
          Names of extra secrets the build command needs, separated by spaces,
          commas or newlines, such as GOOGLE_OAUTH_CLIENT_BASE64. Each one comes
          from the caller (secrets: inherit, including the production
          environment) and reaches the build step as an environment variable of
          the same name. The run fails if one isn't set.
        type: string
        default: ''
    secrets:
      APPS_TOKEN:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_SIGNING_PROFILE:
        required: false
      AZURE_SIGNING_PUBLISHER:
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    concurrency:
      group: release-windows-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # The steps live in actions/release-windows, which apps owned by other
      # accounts call from their own job. Check out the app first: checking it
      # out later would clean .apps-tooling away.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          repository: Moulik-Budhiraja/app-hosting
          ref: ${{ inputs.tooling-ref }}
          path: .apps-tooling
          persist-credentials: false

      - name: Build, sign and publish
        uses: ./.apps-tooling/actions/release-windows
        with:
          checkout: 'false'
          directory: ${{ inputs.directory }}
          build-secrets: ${{ inputs.build-secrets }}
          secrets: ${{ toJSON(secrets) }}
