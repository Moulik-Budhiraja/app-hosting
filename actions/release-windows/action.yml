# Builds, signs and publishes the Windows build of an app from a release tag.
# It runs inside the caller's own job, so that job declares runs-on and
# environment: production, and its secrets (environment secrets included) come
# from the caller repo. Apps owned by another account than Moulik-Budhiraja
# must use this form: GitHub's `secrets: inherit` doesn't reach a reusable
# workflow across owners. A caller job:
#
#   windows:
#     runs-on: [self-hosted, windows]
#     environment: production
#     timeout-minutes: 90
#     concurrency:
#       group: release-windows-${{ github.repository }}
#       cancel-in-progress: false
#     steps:
#       - uses: Moulik-Budhiraja/app-hosting/actions/release-windows@main
#         with:
#           apps-token: ${{ secrets.APPS_TOKEN }}
#           sparkle-private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}
#           azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
#           azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
#           azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
#           azure-signing-endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
#           azure-signing-account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
#           azure-signing-profile: ${{ secrets.AZURE_SIGNING_PROFILE }}
#           azure-signing-publisher: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
#           # Only if the build needs secrets of its own:
#           build-env: |
#             GOOGLE_OAUTH_CLIENT_BASE64=${{ secrets.GOOGLE_OAUTH_CLIENT_BASE64 }}
#
# Leave sparkle-private-key out for electron apps.
#
# release-windows.yml wraps this action for apps under Moulik-Budhiraja. The
# runner needs Git for Windows (its bash first on PATH, not WSL's) and
# PowerShell 7; the action sets up Node 24 and the .NET 8 runtime. See DESIGN.md.
name: Release Windows app
description: Build, sign and publish an app's Windows release from a release tag.

inputs:
  directory:
    description: Folder holding apps.json, relative to the repo root.
    default: .
  apps-token:
    description: secrets.APPS_TOKEN.
    default: ''
  sparkle-private-key:
    description: secrets.SPARKLE_PRIVATE_KEY (Sparkle apps only).
    default: ''
  azure-tenant-id:
    description: secrets.AZURE_TENANT_ID.
    default: ''
  azure-client-id:
    description: secrets.AZURE_CLIENT_ID.
    default: ''
  azure-client-secret:
    description: secrets.AZURE_CLIENT_SECRET.
    default: ''
  azure-signing-endpoint:
    description: secrets.AZURE_SIGNING_ENDPOINT.
    default: ''
  azure-signing-account:
    description: secrets.AZURE_SIGNING_ACCOUNT.
    default: ''
  azure-signing-profile:
    description: secrets.AZURE_SIGNING_PROFILE.
    default: ''
  azure-signing-publisher:
    description: secrets.AZURE_SIGNING_PUBLISHER.
    default: ''
  build-env:
    description: >-
      Environment variables for the build command only, usually secrets the app
      bundles: NAME=value lines, or for a value with several lines, a NAME<<DELIMITER
      line, the value, and a line holding only DELIMITER. Values are masked in logs.
      The run fails if a value is empty.
    default: ''
  build-secrets:
    description: >-
      Deprecated, use build-env. Names of secrets to look up in the secrets input
      and hand to the build.
    default: ''
  secrets:
    description: >-
      Deprecated, pass each secret as its own input. The job's secrets as JSON; the
      action reads its secrets from it when their own inputs are empty.
    default: ''
  checkout:
    description: >-
      Check out the calling repo first. release-windows.yml checks it out itself
      and passes false.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check out the app
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Warn about deprecated inputs
      if: inputs.secrets != '' || inputs.build-secrets != ''
      shell: bash
      run: |
        echo "::warning::The secrets and build-secrets inputs are deprecated: they hand the action every secret in the repo. Pass each secret as its own input (apps-token, sparkle-private-key, azure-*) and build secrets as build-env lines."

    - name: Copy the release tooling
      shell: pwsh
      run: |
        # The scripts and CLI come with the action, at the ref it was called at.
        $root = (Resolve-Path (Join-Path $env:GITHUB_ACTION_PATH '../..')).Path
        $dest = Join-Path $env:RUNNER_TEMP 'apps-tooling'
        Remove-Item -LiteralPath $dest -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path $dest | Out-Null
        Copy-Item -LiteralPath (Join-Path $root 'scripts'), (Join-Path $root 'cli') -Destination $dest -Recurse
        "APPS_TOOLING=$dest" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Read apps.json
      id: config
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        bash "$APPS_TOOLING/scripts/common/read-config.sh" apps.json windows | tee -a "$GITHUB_OUTPUT"

    - name: Check the secrets
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        APPS_TOKEN: ${{ inputs.apps-token || fromJSON(inputs.secrets || '{}').APPS_TOKEN }}
      run: |
        if [[ -z $APPS_TOKEN ]]; then
          echo "::error::APPS_TOKEN didn't reach the release job. Give the job environment: production and pass apps-token from secrets.APPS_TOKEN; apps init sets the secrets."
          exit 1
        fi

    - name: Mask the build env
      if: inputs.build-env != ''
      shell: bash
      env:
        APPS_BUILD_ENV: ${{ inputs.build-env }}
      run: |
        node "$APPS_TOOLING/scripts/common/build-env.mjs" mask

    - name: Check the tag
      id: tag
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        REF_TYPE: ${{ github.ref_type }}
        TAG: ${{ github.ref_name }}
        PREFIX: ${{ steps.config.outputs.tag_prefix }}
        PREFIXES: ${{ steps.config.outputs.tag_prefixes }}
      run: |
        [[ $REF_TYPE == tag ]] || { echo "Releases run from tags like ${PREFIX}1.2.3 pushed on main" >&2; exit 1; }
        # The prefixes have no spaces (read-config checks), so split them into arguments.
        # shellcheck disable=SC2086
        bash "$APPS_TOOLING/scripts/common/check-tag.sh" "$TAG" ${PREFIXES:-$PREFIX} | tee -a "$GITHUB_OUTPUT"

    - name: Skip if already published
      id: existing
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        REMOTE_URL: ${{ steps.config.outputs.remote_url }}
        APP: ${{ steps.config.outputs.app }}
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        # An earlier attempt may have published this version for Windows
        # already; the server would refuse it again. macOS files in the same
        # release don't count.
        published=$(bash "$APPS_TOOLING/scripts/common/published.sh" "$REMOTE_URL" "$APP" "$VERSION" windows)
        echo "published=$published" >> "$GITHUB_OUTPUT"
        if [[ $published == true ]]; then
          echo "::notice::$APP $VERSION is already published for Windows on $REMOTE_URL; nothing to do."
        fi

    - name: Build the apps CLI
      if: steps.existing.outputs.published != 'true'
      shell: bash
      run: |
        cd "$APPS_TOOLING/cli"
        npm ci --no-audit --no-fund
        npm run build

    - uses: actions/setup-dotnet@v4
      if: steps.existing.outputs.published != 'true'
      with:
        dotnet-version: 8.0.x

    - name: Build and sign
      id: build
      if: steps.existing.outputs.published != 'true'
      shell: pwsh
      working-directory: ${{ inputs.directory }}
      env:
        VERSION: ${{ steps.tag.outputs.version }}
        BUILD: ${{ steps.tag.outputs.build }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id || fromJSON(inputs.secrets || '{}').AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id || fromJSON(inputs.secrets || '{}').AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ inputs.azure-client-secret || fromJSON(inputs.secrets || '{}').AZURE_CLIENT_SECRET }}
        AZURE_SIGNING_ENDPOINT: ${{ inputs.azure-signing-endpoint || fromJSON(inputs.secrets || '{}').AZURE_SIGNING_ENDPOINT }}
        AZURE_SIGNING_ACCOUNT: ${{ inputs.azure-signing-account || fromJSON(inputs.secrets || '{}').AZURE_SIGNING_ACCOUNT }}
        AZURE_SIGNING_PROFILE: ${{ inputs.azure-signing-profile || fromJSON(inputs.secrets || '{}').AZURE_SIGNING_PROFILE }}
        AZURE_SIGNING_PUBLISHER: ${{ inputs.azure-signing-publisher || fromJSON(inputs.secrets || '{}').AZURE_SIGNING_PUBLISHER }}
        # Only when the caller passes build secrets. The wrapper hands the build
        # just those and drops these three variables.
        APPS_BUILD_ENV: ${{ inputs.build-env }}
        APPS_BUILD_SECRETS: ${{ inputs.build-secrets }}
        APPS_SECRETS_JSON: ${{ inputs.build-secrets != '' && inputs.secrets || '' }}
      run: |
        if ($env:APPS_BUILD_ENV -or $env:APPS_BUILD_SECRETS) {
          $pwsh = (Get-Process -Id $PID).Path
          & node "$env:APPS_TOOLING/scripts/common/with-build-secrets.mjs" $pwsh -NoProfile -NonInteractive -File "$env:APPS_TOOLING/scripts/windows/build-release.ps1" apps.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          & "$env:APPS_TOOLING/scripts/windows/build-release.ps1" apps.json
        }

    - name: Release notes
      id: notes
      if: steps.existing.outputs.published != 'true'
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # An annotated tag's message becomes the release notes. actions/checkout
        # fetches the pushed tag as a lightweight tag, so fetch the tag object.
        git fetch --quiet --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
        file="$RUNNER_TEMP/release-notes.md"
        if [[ $(git cat-file -t "refs/tags/$TAG") == tag ]]; then
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' > "$file"
        fi
        if [[ -s $file ]] && grep -q '[^[:space:]]' "$file"; then
          echo "file=$file" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish
      if: steps.existing.outputs.published != 'true'
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        APPS_TOKEN: ${{ inputs.apps-token || fromJSON(inputs.secrets || '{}').APPS_TOKEN }}
        SPARKLE_PRIVATE_KEY: ${{ inputs.sparkle-private-key || fromJSON(inputs.secrets || '{}').SPARKLE_PRIVATE_KEY }}
        VERSION: ${{ steps.tag.outputs.version }}
        BUILD: ${{ steps.tag.outputs.build }}
        INSTALLER: ${{ steps.build.outputs.installer }}
        BLOCKMAP: ${{ steps.build.outputs.blockmap }}
        MINIMUM_SYSTEM_VERSION: ${{ steps.build.outputs.minimum_system_version }}
        ICON: ${{ steps.build.outputs.icon }}
        NOTES_FILE: ${{ steps.notes.outputs.file }}
      run: |
        args=(publish --platform windows --version "$VERSION" --build "$BUILD" --installer "$INSTALLER")
        [[ -n $BLOCKMAP ]] && args+=(--blockmap "$BLOCKMAP")
        [[ -n $MINIMUM_SYSTEM_VERSION ]] && args+=(--minimum-system-version "$MINIMUM_SYSTEM_VERSION")
        [[ -n $ICON ]] && args+=(--icon "$ICON")
        [[ -n $NOTES_FILE ]] && args+=(--notes-file "$NOTES_FILE")
        node "$APPS_TOOLING/cli/dist/index.js" "${args[@]}"

    - name: Check the live feed
      if: steps.existing.outputs.published != 'true'
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        REMOTE_URL: ${{ steps.config.outputs.remote_url }}
        APP: ${{ steps.config.outputs.app }}
        UPDATER: ${{ steps.config.outputs.updater }}
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        if [[ $UPDATER == sparkle ]]; then
          feed="$REMOTE_URL/$APP/appcast-windows.xml"
          pattern="<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"
        else
          feed="$REMOTE_URL/$APP/latest.yml"
          pattern="version: \"$VERSION\""
        fi
        for _ in $(seq 1 10); do
          if curl --fail --silent --show-error --max-time 15 "$feed" | grep -qF "$pattern"; then
            echo "$feed offers $VERSION"
            exit 0
          fi
          sleep 3
        done
        echo "$feed doesn't offer $VERSION" >&2
        exit 1
